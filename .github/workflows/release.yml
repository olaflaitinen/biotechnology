# =============================================================================
#  .github/workflows/release.yml
# -----------------------------------------------------------------------------
#  Publish a release to PyPI, with provenance.
#
#  SECURITY DESIGN
#  This workflow uses PyPI TRUSTED PUBLISHING (OpenID Connect), not a
#  long-lived API token. There is no PyPI credential stored in this repository
#  or in its secrets. PyPI verifies the identity of this specific workflow, in
#  this specific repository, running in this specific environment, and issues a
#  short-lived token for one upload.
#
#  That matters more than anything else in this file. The realistic
#  supply-chain risk to a dependency-free library is not a vulnerable
#  transitive dependency; it is a stolen publishing token. Removing the token
#  removes the risk class. See THREAT_MODEL.md, threat T-06.
#
#  Three further controls:
#
#    * BUILD PROVENANCE. actions/attest-build-provenance signs a statement
#      binding each artefact to the exact commit, workflow and runner that
#      produced it. A consumer can verify with "gh attestation verify" that a
#      wheel came from this repository and not from somewhere else.
#    * SOFTWARE BILL OF MATERIALS. A CycloneDX SBOM is generated and attached
#      to the release, so that an organisation with an SBOM ingestion
#      requirement does not have to construct one by guesswork.
#    * ENVIRONMENT PROTECTION. The publish job runs in the "pypi" environment,
#      which can carry a required-reviewer rule so that publication needs a
#      human approval even from an automated tag push.
#
#  RELEASE PROCEDURE
#    1. Update version in pyproject.toml.
#    2. Update version and date-released in CITATION.cff to match.
#    3. Move the Unreleased section of CHANGELOG.md under the new version, and
#       record the DATA FREEZE DATE, meaning the date the factual and
#       regulatory claims were last verified. This is not optional.
#    4. Commit, then tag with a signed tag:
#           git tag -s v0.1.0 -m "v0.1.0"
#    5. Push the tag:
#           git push origin v0.1.0
#
#  The workflow refuses to publish if the tag, pyproject.toml and CITATION.cff
#  disagree, if the CHANGELOG has no entry, if that entry has no data freeze
#  date, or if the tag is unsigned.
#
#  SPDX-License-Identifier: EUPL-1.2
# =============================================================================

name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: "boolean"
        default: true

permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===========================================================================
  #  1. Consistency and provenance gate.
  #
  #  Four places record or attest the release, and they must agree. Catching a
  #  mismatch here costs thirty seconds; catching it after publication means
  #  yanking a release, which for a citable artefact is genuinely damaging
  #  because a citation to a yanked version cannot be repaired retroactively.
  # ===========================================================================
  verify:
    name: "Verify release metadata"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    outputs:
      version: "${{ steps.check.outputs.version }}"
    steps:
      - name: "Check out with tags"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Compare tag, pyproject.toml and CITATION.cff"
        id: "check"
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=""
          fi

          PYPROJECT=$(python tools/read_version.py --source pyproject)
          CFF=$(python tools/read_version.py --source citation)

          echo "tag=${TAG:-none}  pyproject=$PYPROJECT  citation=$CFF"

          if [ "$PYPROJECT" != "$CFF" ]; then
            echo "::error::pyproject.toml ($PYPROJECT) and CITATION.cff ($CFF) disagree."
            exit 1
          fi

          if [ -n "$TAG" ] && [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag ($TAG) and pyproject.toml ($PYPROJECT) disagree."
            exit 1
          fi

          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

      - name: "Require a CHANGELOG entry with a data freeze date"
        run: "python tools/check_changelog.py --version '${{ steps.check.outputs.version }}'"

      # -----------------------------------------------------------------------
      #  An unsigned tag is a tag anyone with push access could have created,
      #  and the whole provenance chain below rests on the tag being the
      #  maintainer's. A dry run is exempt because there is no tag.
      # -----------------------------------------------------------------------
      - name: "Require a signed tag"
        if: "github.event_name == 'push'"
        run: |
          set -euo pipefail
          if git verify-tag "${GITHUB_REF_NAME}" 2>/dev/null; then
            echo "Tag ${GITHUB_REF_NAME} carries a valid signature."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} is unsigned or its signature could not be verified. Create it with 'git tag -s'."
            exit 1
          fi

  # ===========================================================================
  #  2. Full quality gate. The same checks CI runs, re-run against the tag.
  #     Nothing is published that has not passed the ordinary bar.
  # ===========================================================================
  quality:
    name: "Full quality gate"
    runs-on: "ubuntu-latest"
    timeout-minutes: 25
    needs: ["verify"]
    permissions:
      contents: "read"
    steps:
      - name: "Check out"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: "Install"
        run: "python -m pip install -e '.[dev]'"

      - name: "Lint and type check"
        run: "make lint typecheck"

      - name: "Repository policy"
        run: |
          python tools/check_no_dependencies.py
          python tools/check_dashes.py
          python tools/check_action_pinning.py --strict
          python tools/check_licence_headers.py

      - name: "Taxonomy integrity"
        run: "make validate"

      - name: "Tests"
        run: "python -m pytest tests -q"

      - name: "Documentation builds strictly"
        run: |
          python tools/generate_docs.py --output docs
          python -m mkdocs build --strict

  # ===========================================================================
  #  3. Build, with a bill of materials.
  # ===========================================================================
  build:
    name: "Build distribution"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    needs: ["verify", "quality"]
    permissions:
      contents: "read"
    steps:
      - name: "Check out"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install build tooling"
        run: |
          python -m pip install '.[build]'
          python -m pip install cyclonedx-bom

      - name: "Build"
        run: "python -m build"

      - name: "Check"
        run: |
          python -m twine check --strict dist/*
          cffconvert --validate

      - name: "Generate a CycloneDX software bill of materials"
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/sbomenv/bin/python -m pip install cyclonedx-bom
          /tmp/sbomenv/bin/cyclonedx-py environment \
            --output-format JSON \
            --output-file dist/biotechnology-sbom.cdx.json
          echo "SBOM written."

      - name: "Record artefact checksums in the run summary"
        run: |
          {
            echo "### Artefact checksums"
            echo ""
            echo '```'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload distribution"
        uses: "actions/upload-artifact@v4"
        with:
          name: "distribution"
          path: "dist/"

  # ===========================================================================
  #  4. Sign a provenance attestation for every artefact.
  #
  #  This is what lets a consumer run
  #      gh attestation verify biotechnology-0.1.0-py3-none-any.whl \
  #         --repo olaflaitinen/biotechnology
  #  and get a cryptographic answer rather than a promise.
  # ===========================================================================
  attest:
    name: "Attest build provenance"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    needs: ["build"]
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: "read"
      id-token: "write"
      attestations: "write"
    steps:
      - name: "Download distribution"
        uses: "actions/download-artifact@v4"
        with:
          name: "distribution"
          path: "dist/"

      - name: "Attest"
        uses: "actions/attest-build-provenance@v1"
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

  # ===========================================================================
  #  5. Publish to PyPI by trusted publishing.
  #
  #  id-token: write is what lets GitHub mint the OIDC assertion PyPI checks.
  #  No secret is read here because none exists.
  # ===========================================================================
  publish:
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    needs: ["verify", "build", "attest"]
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/biotechnology"
    permissions:
      id-token: "write"
    steps:
      - name: "Download distribution"
        uses: "actions/download-artifact@v4"
        with:
          name: "distribution"
          path: "dist/"

      - name: "Remove the SBOM from the upload set"
        run: "rm -f dist/*.cdx.json"

      - name: "Publish"
        uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          print-hash: true
          attestations: true

  # ===========================================================================
  #  6. GitHub release, carrying the artefacts and the SBOM.
  # ===========================================================================
  github-release:
    name: "Create GitHub release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    needs: ["verify", "publish"]
    permissions:
      contents: "write"
    steps:
      - name: "Check out"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Download distribution"
        uses: "actions/download-artifact@v4"
        with:
          name: "distribution"
          path: "dist/"

      - name: "Extract the changelog section for this version"
        run: "python tools/extract_release_notes.py --version '${{ needs.verify.outputs.version }}' --output release-notes.md"

      - name: "Create release"
        uses: "softprops/action-gh-release@v3"
        with:
          body_path: "release-notes.md"
          files: "dist/*"
          draft: false
          prerelease: "${{ contains(needs.verify.outputs.version, 'rc') }}"
