  # ###########################################################################
  - type: "markdown"
    attributes:
      value: |
        ---
        ## Section 9. Confirmation

  - type: "checkboxes"
    id: "confirm"
    attributes:
      label: "9.1 Before you submit"
      options:
        - label: "I have searched existing issues and this is not a duplicate."
          required: true
        - label: >-
            This is about how the material is presented, not about a fact being
