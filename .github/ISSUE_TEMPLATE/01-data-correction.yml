  # ###########################################################################
  #  SECTION 7: CONSEQUENCES
  # ###########################################################################
  - type: "markdown"
    attributes:
      value: |
        ---
        ## Section 7. Consequences of accepting the correction

  - type: "checkboxes"
    id: "knock_on"
    attributes:
      label: "7.1 Tick everything accepting this would also require"
      description: "If you are not sure, tick nothing. Working this out is our job."
      options:
        - label: "Changing an evidence grade on a metric"
        - label: "Changing a unit or an order of magnitude"
        - label: "Adding or removing a cross-reference in RELATED"
        - label: "Adding or removing a citation in the bibliography"
        - label: "Adding or removing a glossary term"
        - label: "Changing the plain-language paragraph as well as the technical one"
        - label: "Changing the analogy, because it no longer holds"
        - label: "Changing a controlled-vocabulary value such as MATURITY"
        - label: "Adding or removing an SDG"
        - label: "Adding a new formula module"
        - label: "Adding a milestone"
        - label: "Adding a challenge"
        - label: "Splitting or merging a subtype"
        - label: "Renaming a key, which is a breaking change"
        - label: "Updating the branch-level profile"
        - label: "Nothing beyond the field itself"

  - type: "dropdown"
    id: "breaking"
    attributes:
      label: "7.2 Would this rename or remove a public identifier?"
      description: >-
        Subtype keys, branch keys, formula keys, glossary keys and citation keys
        are public API. External work cites these strings. See GOVERNANCE.md
        section 3.6.
      options:
        - "No"
        - "Yes, a subtype key"
        - "Yes, a glossary key"
        - "Yes, a citation key"
        - "Yes, a formula key"
        - "I do not know"
    validations:
      required: false

  - type: "dropdown"
    id: "needs_new_record"
    attributes:
      label: "7.3 Does the correction imply a new record is needed?"
      options:
        - "No"
        - "Yes, a new subtype"
        - "Yes, a new glossary term"
        - "Yes, a new formula"
        - "Yes, a new bibliography entry"
        - "Yes, a new organism or technique entry"
        - "I do not know"
    validations:
      required: false

  - type: "dropdown"
    id: "split_merge"
    attributes:
      label: "7.4 Does it imply splitting or merging existing records?"
      options:
        - "No"
        - "Yes, one record should become two"
        - "Yes, two records should become one"
        - "Yes, a record should move to another branch"
        - "I do not know"
    validations:
      required: false

  - type: "dropdown"
    id: "urgency"
    attributes:
      label: "7.5 How urgent is publishing the correction?"
      options:
        - "Not urgent, next release is fine"
        - "Moderately, it would be good within a few weeks"
        - "Urgent, the current text is actively misleading"
        - "Very urgent, someone could act on it"
    validations:
      required: false

  - type: "dropdown"
    id: "release_needed"
    attributes:
      label: "7.6 Should a release be cut for it?"
      options:
        - "No, fold it into the next release"
        - "Yes, a patch release would be appropriate"
        - "I have no view"
    validations:
      required: false

  - type: "dropdown"
    id: "changelog"
    attributes:
      label: "7.7 Should this appear in the changelog?"
      options:
        - "Yes, it is a substantive correction"
        - "No, it is a typo"
        - "I have no view"
    validations:
      required: false

  - type: "dropdown"
    id: "freeze_note"
    attributes:
      label: "7.8 Does the data freeze date need a note?"
      description: >-
        If the correction reflects a change in the world rather than an error in
        our reading, the freeze date is the honest place to record that.
      options:
        - "No, this was always wrong"
        - "Yes, the world changed after the freeze date"
        - "I have no view"
    validations:
      required: false

  # ###########################################################################
  #  SECTION 8: EDITORIAL CONSEQUENCES
  # ###########################################################################
  - type: "markdown"
    attributes:
      value: |
        ---
        ## Section 8. Editorial consequences

        These test the correction against the fourteen rules in
        `STYLE_GUIDE.md`. Skip if the correction is a bare number or date.

  - type: "dropdown"
    id: "rule3_balance"
    attributes:
      label: "8.1 Does the correction preserve the cost-and-benefit balance?"
      description: >-
        Editorial rule 3: a why-it-matters paragraph must state the price, the
        controversy or the access problem alongside the achievement.
      options:
        - "Yes, balance is preserved"
        - "It improves the balance"
        - "It removes a stated downside, and a replacement is needed"
        - "It removes a stated benefit, and a replacement is needed"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "readability"
    attributes:
      label: "8.2 Does the correction keep the plain-language paragraph readable?"
      options:
        - "Yes"
        - "It makes it clearer"
        - "It makes it longer but still clear"
        - "It makes it harder, and a rewrite is needed"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "jargon"
    attributes:
      label: "8.3 Does the proposed wording introduce jargon?"
      description: >-
        Editorial rule 1: no word in PLAIN_LANGUAGE that would need a glossary
        in a general newspaper.
      options:
        - "No"
        - "Yes, but only in the technical register, which is fine"
        - "Yes, in the plain-language register, and it needs explaining"
        - "Yes, and I have suggested a plain alternative below"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "analogy_validity"
    attributes:
      label: "8.4 Does the correction affect the analogy?"
      options:
        - "No"
        - "Yes, the analogy no longer holds"
        - "Yes, the analogy now misleads"
        - "The analogy could be improved, though it is not wrong"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "milestone_needed"
    attributes:
      label: "8.5 Does a milestone need adding?"
      description: >-
        Editorial rule 8: a timeline of unbroken triumph is a marketing
        document. Setbacks belong in the record.
      options:
        - "No"
        - "Yes, an achievement"
        - "Yes, a setback, which rule 8 specifically asks for"
        - "Yes, a regulatory event"
        - "An existing milestone is misdated"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "challenge_needed"
    attributes:
      label: "8.6 Does a challenge need adding?"
      description: >-
        Editorial rule 7: at least four challenges, at least one of them
        non-technical.
      options:
        - "No"
        - "Yes, a technical challenge"
        - "Yes, a cost or access challenge"
        - "Yes, a regulatory challenge"
        - "Yes, a public acceptance challenge"
        - "Yes, a capacity or geography challenge"
        - "An existing challenge is no longer true"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "application_reality"
    attributes:
      label: "8.7 Does an application need removing as not real?"
      description: >-
        Editorial rule 6: an application must name something a reader could go
        and look up.
      options:
        - "No"
        - "Yes, one listed application never happened"
        - "Yes, one was discontinued or withdrawn"
        - "Yes, one is aspirational rather than deployed"
        - "Not applicable"
    validations:
      required: false

  - type: "dropdown"
    id: "spelling"
    attributes:
      label: "8.8 Does the proposed wording follow the house conventions?"
      description: >-
        British spelling, ASCII punctuation only, no em dashes, numbers as words
        up to ten. See STYLE_GUIDE.md section 3. We will fix this if not.
      options:
        - "Yes"
        - "I am not sure, please adjust it"
        - "Not applicable"
    validations:
      required: false

