      required: false

  # ###########################################################################
  #  SECTION 10: PROCESS
  # ###########################################################################
  - type: "markdown"
    attributes:
      value: |
        ---
        ## Section 10. Process

  - type: "dropdown"
    id: "willing_pr"
    attributes:
      label: "10.1 Would you like to make the change yourself?"
      description: "There is no expectation either way. It is a one-file edit."
      options:
        - "No, please make it for me"
        - "Yes, I will open a pull request"
        - "Yes, if someone shows me where the file is"
        - "I would rather someone else did it but I will review it"
    validations:
      required: false

  - type: "dropdown"
    id: "willing_editor"
    attributes:
      label: "10.2 Would you consider becoming a domain or jurisdictional editor?"
      description: >-
        GOVERNANCE.md section 6 describes domain editors as the intended growth
        path for this project. There is no commitment implied by answering.
      options:
        - "No"
        - "Maybe, ask me again"
        - "Yes, for this branch"
        - "Yes, for this jurisdiction"
        - "Yes, for the plain-language register"
        - "Tell me more first"
    validations:
      required: false

  - type: "dropdown"
    id: "willing_review"
    attributes:
      label: "10.3 Would you review related records for the same problem?"
      options:
        - "No"
        - "Yes, a handful"
        - "Yes, a whole branch"
        - "Yes, the whole taxonomy for this class of error"
    validations:
      required: false

  - type: "dropdown"
    id: "timeline"
    attributes:
      label: "10.4 Do you need this fixed by a particular time?"
      description: >-
        An honest answer helps. This is an unfunded academic project with one
        maintainer, and a deadline is information rather than pressure.
      options:
        - "No"
        - "Within a few months would be useful"
        - "I have a deadline this year"
        - "I have a deadline within weeks"
        - "I need it now and will work around it in the meantime"
    validations:
      required: false

  - type: "dropdown"
    id: "notify"
    attributes:
      label: "10.5 How would you like to hear the outcome?"
      options:
        - "A comment on this issue is fine"
        - "Please tag me explicitly"
        - "Email me"
        - "I do not need to be told"
    validations:
      required: false

  - type: "textarea"
    id: "context"
    attributes:
      label: "10.6 Anything else?"
      description: >-
        Your name if you asked to be credited that way, the detail of a declared
        interest, related problems, or anything that did not fit above.
    validations:
      required: false

  # ###########################################################################
  #  SECTION 11: CONFIRMATION
  # ###########################################################################
  - type: "markdown"
    attributes:
      value: |
        ---
        ## Section 11. Confirmation

  - type: "checkboxes"
    id: "confirm"
    attributes:
      label: "11.1 Before you submit"
      options:
        - label: >-
            I have given a source that a maintainer can check independently, or
            I have explained why no document exists.
          required: true
        - label: >-
            I understand that corrections are settled by citation, and that a
            maintainer may come back with a different source.
          required: true
        - label: >-
            I have searched existing issues and this is not a duplicate.
          required: true
        - label: >-
