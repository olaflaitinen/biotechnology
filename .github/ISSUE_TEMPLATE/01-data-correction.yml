    attributes:
      value: |
        ---
        ## Section 9. About you

        All optional. It helps triage and it helps us credit you correctly.
        "Prefer not to say" is always an acceptable answer and never counts
        against a report.

  - type: "dropdown"
    id: "expertise"
    attributes:
      label: "9.1 What is your relationship to this subject?"
