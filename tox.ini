# =============================================================================
#  tox.ini
# -----------------------------------------------------------------------------
#  Multi-version test matrix.
#
#  WHY THIS EXISTS ALONGSIDE CI
#  Continuous integration runs the same matrix, but a contributor should be
#  able to reproduce a version-specific failure locally without pushing a
#  commit and waiting. `tox -e py39` is that command.
#
#  WHY PYTHON 3.9 IS STILL SUPPORTED
#  It remains the system Python on long-term-support Linux distributions used
#  in university and hospital laboratories, which is precisely where this
#  library is meant to be importable without a virtual environment fight.
#  Dropping it is a breaking change and needs a major version bump.
#
#  SPDX-License-Identifier: EUPL-1.2
# =============================================================================

[tox]
envlist =
    py39
    py310
    py311
    py312
    py313
    lint
    typecheck
    integrity
    docs
isolated_build = True
skip_missing_interpreters = True


# =============================================================================
#  The test matrix
# =============================================================================
[testenv]
description = Run the test suite on {basepython}
extras = test
commands =
    pytest {posargs:tests} --cov=biotechnology --cov-report=term-missing


# =============================================================================
#  Static checks. Pinned to one interpreter, because running a linter five
#  times tells you nothing the first run did not.
# =============================================================================
[testenv:lint]
description = ruff and black, check only
basepython = python3.12
extras = lint
skip_install = true
commands =
    ruff check src/biotechnology tests tools
    black --check --diff src/biotechnology tests tools

[testenv:format]
description = Apply ruff --fix and black
basepython = python3.12
extras = lint
skip_install = true
commands =
    ruff check --fix src/biotechnology tests tools
    black src/biotechnology tests tools

[testenv:typecheck]
description = mypy --strict over the package
basepython = python3.12
extras = lint
commands =
    mypy src/biotechnology


# =============================================================================
#  Taxonomy integrity. Separated so that a contributor who has only edited a
#  data record can run the relevant check in a couple of seconds.
# =============================================================================
[testenv:integrity]
description = Cross-reference and editorial integrity over the whole taxonomy
basepython = python3.12
extras = test
commands =
    python -m biotechnology validate --strict
    pytest tests/test_integrity.py tests/test_facets.py tests/test_editorial.py -q


# =============================================================================
#  Documentation
# =============================================================================
[testenv:docs]
description = Regenerate docs/ and build the site
basepython = python3.12
extras = docs
commands =
    python tools/generate_docs.py --output docs
    mkdocs build --strict

[testenv:docs-serve]
description = Serve the documentation site locally
basepython = python3.12
extras = docs
commands =
    python tools/generate_docs.py --output docs
    mkdocs serve


# =============================================================================
#  Packaging
# =============================================================================
[testenv:build]
description = Build sdist and wheel, then check them
basepython = python3.12
extras = build
skip_install = true
commands =
    python -m build
    twine check dist/*
    cffconvert --validate


# =============================================================================
#  Continuous integration entry point. Mirrors `make all`.
# =============================================================================
[testenv:ci]
description = Everything, in the order CI runs it
basepython = python3.12
extras = dev
commands =
    ruff check src/biotechnology tests tools
    black --check src/biotechnology tests tools
    mypy src/biotechnology
    python -m biotechnology validate --strict
    pytest tests --cov=biotechnology --cov-report=term-missing
    python tools/generate_docs.py --output docs
    mkdocs build --strict


# =============================================================================
#  GitHub Actions interpreter mapping
# =============================================================================
[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312, lint, typecheck, integrity, docs
    3.13: py313
